project:
  name: ssvep_bci_v2_covariance
  seed: 42
  data_dir: ./data/moabb
  artifact_dir: ./artifacts
  log_dir: ./logs

dataset:
  name: Kalunga2016
  subjects: [1]
  download_if_missing: true

commands:
  native_to_command:
    "13": LEFT
    "21": RIGHT
    "rest": NONE
  ignore_native_labels: ["17"]
  active_commands: [LEFT, RIGHT]
  reject_command: NONE

features:
  type: covariance
  covariance:
    estimator: oas
    normalize: trace
    regularization: 1.0e-6
    bands_hz:
      - [6.0, 50.0]
      - [12.0, 50.0]
      - [18.0, 50.0]

model:
  type: riemannian_mdm
  riemannian_metric: riemann
  probability_temperature: 1.0

decision:
  type: markov_evidence
  mode: held_state
  posterior_threshold: 0.80
  self_transition_active: 0.97
  self_transition_none: 0.94
  observation_temperature: 1.0
  switch_hold_seconds: 0.25

alignment:
  type: euclidean
  enabled: true
  mode: warmup_freeze
  warmup_seconds: 15.0
  update_tau_seconds: 30.0
  min_quality: 0.60
  regularization: 1.0e-6

adaptation:
  enabled: false
  type: riemannian_prototype
  min_temporal_posterior: 0.95
  min_margin: 0.40
  min_dwell_seconds: 1.25
  switch_exclusion_seconds: 0.75
  max_updates_per_second: 1.0
  eta: 0.02
  anchor_gamma: 0.35
  max_anchor_distance: 2.5
  allowed_phases: [INFERENCE, CHALLENGE_STREAMING]
